<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Details - Mahalakshmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #cbd5e1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding-bottom: 90px; }
        .app-container::-webkit-scrollbar { display: none; }
        @media (max-width: 450px) { .app-container { height: 100vh; max-height: 100vh; } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <div class="bg-blue-900 text-white px-4 py-3.5 flex items-center justify-between shadow-lg sticky top-0 z-40">
        <div class="flex items-center space-x-2.5">
            <button onclick="goBackDashboard()" class="bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded-xl text-xs font-black">← Back</button>
            <div>
                <h1 id="market-title" class="font-black tracking-wider text-base uppercase leading-none">MARKET</h1>
                <p id="market-date-sub" class="text-[10px] text-blue-200 font-mono mt-0.5">--/--/----</p>
            </div>
        </div>
        <div class="bg-indigo-950/80 border border-indigo-700/50 px-3 py-1.5 rounded-2xl text-right">
            <span class="block text-[8px] text-indigo-300 font-bold uppercase tracking-wider">Balance</span>
            <span id="wallet-balance-text" class="text-amber-400 font-black text-xs font-mono">₹0</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-4 space-y-4">

        <!-- THIS WEEK (LINE BY LINE DAYS) -->
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-200 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-xs text-blue-950 uppercase tracking-widest">📅 THIS WEEK</h2>
                <span class="text-[10px] font-bold text-gray-400 uppercase">Select Day</span>
            </div>

            <div id="week-days-bar" class="flex flex-col space-y-2">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- SELECTED DAY GAME CARD -->
        <div id="day-game-card" class="bg-white rounded-3xl p-4 shadow-sm border border-gray-200 flex flex-col space-y-3">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <div class="flex items-center space-x-2.5">
                    <div class="w-10 h-10 bg-blue-50 rounded-2xl flex items-center justify-center shadow-sm border border-blue-100 overflow-hidden shrink-0">
                        <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-8 h-8 object-contain">
                    </div>
                    <div>
                        <h3 id="card-market-heading" class="font-black text-sm tracking-wider text-gray-900 uppercase">MARKET</h3>
                        <span id="card-day-label" class="text-[10px] text-blue-700 font-bold font-mono">--</span>
                    </div>
                </div>
                <div id="card-action-badge"></div>
            </div>

            <div id="card-inner-content" class="space-y-3 pt-1">
                <p class="text-xs text-gray-400 text-center py-4">Loading...</p>
            </div>
        </div>

    </div>

    <!-- FIXED BOTTOM BAR -->
    <div class="fixed bottom-0 left-0 right-0 z-50 flex justify-center pointer-events-none">
        <div class="w-full max-w-[450px] bg-slate-200/95 backdrop-blur-md border-t border-slate-300 p-3 shadow-2xl flex items-center gap-2 pointer-events-auto">
            <button onclick="goBackDashboard()" class="flex-1 bg-blue-900 hover:bg-blue-950 text-white font-black py-2.5 px-4 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Dashboard
            </button>
            <button onclick="window.location.reload();" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-black py-2.5 px-4 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Refresh
            </button>
        </div>
    </div>

    <!-- INSUFFICIENT BALANCE MODAL -->
    <div id="deposit-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-[330px] space-y-4 text-center shadow-2xl">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
            <h3 class="text-gray-800 font-black text-lg">Insufficient Balance</h3>
            <p class="text-xs text-gray-500 font-semibold leading-relaxed">Your wallet does not have enough balance to unlock this game. Please add money to proceed.</p>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeDepositModal()" class="bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs uppercase">Cancel</button>
                <button onclick="redirectToGamePayment()" class="bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase shadow">Add Balance</button>
            </div>
        </div>
    </div>

    <!-- GET GAME CONFIRMATION MODAL -->
    <div id="confirm-game-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 w-full max-w-[330px] space-y-4 text-center shadow-2xl">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">🎯</div>
            <h3 class="text-gray-800 font-black text-lg">Confirm Game Unlock</h3>
            <p id="confirm-modal-text" class="text-xs text-gray-500 font-semibold leading-relaxed">Do you want to spend <span id="confirm-price-span" class="font-black text-blue-600">₹0</span> to unlock this game for 12 hours?</p>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeConfirmModal()" class="bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs uppercase">No</button>
                <button id="btn-execute-unlock" class="bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase shadow">Yes, Unlock</button>
            </div>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA5JXFuo-bImK26QTZMYj8OrD2l1ncf_O4",
        authDomain: "mahalakshmi-1358f.firebaseapp.com",
        projectId: "mahalakshmi-1358f",
        storageBucket: "mahalakshmi-1358f.firebasestorage.app",
        messagingSenderId: "26487681138",
        appId: "1:26487681138:web:dfa4095fa2285b584212eb",
        measurementId: "G-Y2SVGE7BVJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DAYS_ORDER = [
        { key: "monday", label: "Monday" },
        { key: "tuesday", label: "Tuesday" },
        { key: "wednesday", label: "Wednesday" },
        { key: "thursday", label: "Thursday" },
        { key: "friday", label: "Friday" },
        { key: "saturday", label: "Saturday" },
        { key: "sunday", label: "Sunday" }
    ];

    let savedMobile = "";
    let marketName = "";
    let currentUserWallet = 0;
    let unlockedGames = {};
    let marketDocData = null;
    let serverTimeOffset = 0;
    let todayDayKey = "";
    let selectedDayKey = "";
    let activeDayPrice = 100;

    function getTodayDayKey(ms) {
        const dayIdx = new Date(ms).getDay();
        return dayIdx === 0 ? "sunday" : DAYS_ORDER[dayIdx - 1].key;
    }

    function getVisibleDays(weeklyMap, currentDayKey) {
        const currentIdx = DAYS_ORDER.findIndex(d => d.key === currentDayKey);
        return DAYS_ORDER.filter((d, idx) => {
            const hasEntry = weeklyMap && Object.prototype.hasOwnProperty.call(weeklyMap, d.key);
            if (currentIdx === -1) return true;
            return idx <= currentIdx || hasEntry;
        });
    }

    function getDayTimingText(dayKey, weeklyMap, fallbackData) {
        const entry = weeklyMap && weeklyMap[dayKey];
        if (entry && entry.timing && entry.timing.trim()) {
            return entry.timing.trim();
        }
        if (dayKey === todayDayKey && fallbackData && fallbackData.gameDate && fallbackData.gameDate.trim()) {
            return fallbackData.gameDate.trim();
        }
        return "--";
    }

    window.goBackDashboard = function() {
        window.location.href = "dashboard.html";
    }

    window.closeDepositModal = () => document.getElementById('deposit-modal').classList.add('hidden');
    window.closeConfirmModal = () => document.getElementById('confirm-game-modal').classList.add('hidden');

    window.redirectToGamePayment = function() {
        const price = Number(activeDayPrice) || Number(marketDocData?.price) || 100;
        window.location.href = `payment.html?userid=${savedMobile}&amount=${price}&market=${encodeURIComponent(marketName)}`;
    }

    window.handleGetGameClick = function(gamePrice) {
        activeDayPrice = Number(gamePrice) || Number(marketDocData?.price) || 100;
        if (currentUserWallet >= activeDayPrice) {
            document.getElementById('confirm-price-span').innerText = "₹" + activeDayPrice;
            document.getElementById('confirm-game-modal').classList.remove('hidden');
        } else {
            document.getElementById('deposit-modal').classList.remove('hidden');
        }
    }

    document.getElementById('btn-execute-unlock').onclick = async function() {
        closeConfirmModal();
        const price = Number(activeDayPrice) || Number(marketDocData?.price) || 100;
        if (currentUserWallet >= price && savedMobile && marketName) {
            const newBalance = currentUserWallet - price;
            try {
                unlockedGames[marketName] = Date.now() + serverTimeOffset;
                await updateDoc(doc(db, "users", savedMobile), {
                    walletBalance: newBalance,
                    balance: newBalance,
                    unlockedGames: unlockedGames
                });
                currentUserWallet = newBalance;
                document.getElementById('wallet-balance-text').innerText = "₹" + currentUserWallet;
                renderWeekAndCard();
            } catch (e) {
                alert("Transaction failed. Please try again.");
            }
        }
    }

    window.selectWeekDay = function(dayKey) {
        selectedDayKey = dayKey;
        renderWeekAndCard();
    }

    function buildNumbersGridHtml(dayGameObj) {
        const otcRaw = (dayGameObj && dayGameObj.otcValue) || '';
        const jodiRaw = (dayGameObj && dayGameObj.jodiValue) || '';
        const panelRaw = (dayGameObj && dayGameObj.panelValue) || '';

        const otcList = otcRaw ? otcRaw.split(/[\s*\/]+/).filter(Boolean) : [];
        const jodiList = jodiRaw ? jodiRaw.split(/[\s,]+/).filter(Boolean) : [];
        const panelList = panelRaw ? panelRaw.split(/[\s,]+/).filter(Boolean) : [];

        if (!otcList.length && !jodiList.length && !panelList.length) {
            return `<p class="text-xs text-gray-400 font-semibold text-center py-4">No game numbers published for this day yet.</p>`;
        }

        let otcHtml = otcList.map(val => `<div class="bg-blue-50 text-blue-700 font-black text-xs py-2 px-3.5 rounded-xl text-center shadow-sm border border-blue-100 min-w-[36px]">${val}</div>`).join('');
        let jodiHtml = jodiList.map(val => `<div class="bg-indigo-50 text-indigo-700 font-black text-xs py-2 px-3 rounded-xl text-center shadow-sm border border-indigo-100 min-w-[38px]">${val}</div>`).join('');
        let panelHtml = panelList.map(val => `<div class="bg-emerald-50 text-emerald-700 font-black text-xs py-2 px-3 rounded-xl text-center shadow-sm border border-emerald-100 min-w-[44px]">${val}</div>`).join('');

        return `
            <div class="space-y-3 pt-1">
                ${otcList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-blue-900 uppercase tracking-wider w-16 shrink-0">Open</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${otcHtml}</div>
                </div>` : ''}

                ${jodiList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-indigo-900 uppercase tracking-wider w-16 shrink-0">Jodi</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${jodiHtml}</div>
                </div>` : ''}

                ${panelList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-emerald-900 uppercase tracking-wider w-16 shrink-0">Panel</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${panelHtml}</div>
                </div>` : ''}
            </div>`;
    }

    function renderWeekAndCard() {
        const nowMs = Date.now() + serverTimeOffset;
        todayDayKey = getTodayDayKey(nowMs);
        if (!selectedDayKey) selectedDayKey = todayDayKey;

        const weeklyMap = (marketDocData && marketDocData.weeklyGames) || {};
        const visibleDays = getVisibleDays(weeklyMap, todayDayKey);

        if (!visibleDays.some(d => d.key === selectedDayKey)) {
            selectedDayKey = visibleDays.length ? visibleDays[visibleDays.length - 1].key : todayDayKey;
        }

        const daysBar = document.getElementById('week-days-bar');
        daysBar.innerHTML = visibleDays.map(d => {
            const isSelected = d.key === selectedDayKey;
            const timingStr = getDayTimingText(d.key, weeklyMap, marketDocData);
            const activeClass = isSelected
                ? "bg-blue-900 text-white border-blue-900 shadow-md"
                : "bg-slate-50 text-slate-800 border-slate-200 hover:bg-blue-50";
            return `
                <button type="button" onclick="selectWeekDay('${d.key}')" class="w-full px-4 py-3 rounded-2xl border text-left transition-all flex items-center justify-between ${activeClass}">
                    <span class="text-sm font-black tracking-wide">${d.label}</span>
                    <span class="text-[11px] font-mono font-bold ${isSelected ? 'text-amber-300' : 'text-slate-500'}">${timingStr}</span>
                </button>`;
        }).join('');

        const dayMeta = DAYS_ORDER.find(d => d.key === selectedDayKey) || DAYS_ORDER[0];
        const selectedDayEntry = weeklyMap[selectedDayKey] || null;
        const selectedDayTiming = getDayTimingText(selectedDayKey, weeklyMap, marketDocData);

        document.getElementById('card-market-heading').innerText = marketName;
        document.getElementById('card-day-label').innerText = `${dayMeta.label} • ${selectedDayTiming}`;

        const badgeEl = document.getElementById('card-action-badge');
        const contentEl = document.getElementById('card-inner-content');

        const dayStatus = (selectedDayEntry && selectedDayEntry.status) || 'active';
        const gamePrice = (selectedDayEntry && selectedDayEntry.price !== undefined && selectedDayEntry.price !== '')
            ? Number(selectedDayEntry.price)
            : (Number(marketDocData?.price) || 100);
        activeDayPrice = gamePrice;

        const unlockTime = unlockedGames[marketName];
        const hasValidUnlock = Boolean(unlockTime && (nowMs - unlockTime < 12 * 60 * 60 * 1000));
        const shouldShowNumbers = (dayStatus === 'force_show') || (dayStatus === 'active' && hasValidUnlock);

        if (dayStatus === 'locked') {
            badgeEl.innerHTML = `<div class="bg-gray-100 text-gray-500 font-bold text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider border border-gray-200">🔒 CLOSED</div>`;
            contentEl.innerHTML = `<div class="w-full bg-gray-50 text-gray-400 font-bold text-xs py-3 px-4 rounded-2xl uppercase tracking-wider border border-gray-100 text-center">Market is currently closed</div>`;
        } else if (shouldShowNumbers) {
            badgeEl.innerHTML = `<div class="bg-emerald-500 text-white font-bold text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider">✓ UNLOCKED</div>`;
            contentEl.innerHTML = buildNumbersGridHtml(selectedDayEntry);
        } else {
            badgeEl.innerHTML = `<button onclick="handleGetGameClick(${gamePrice})" class="bg-amber-400 hover:bg-amber-500 text-blue-950 font-black text-[10px] py-1.5 px-3 rounded-xl shadow uppercase tracking-wider transition-transform active:scale-95">🔥 GET GAME (₹${gamePrice})</button>`;
            contentEl.innerHTML = `<p class="text-[11px] text-gray-500 font-semibold py-3 text-center">Unlock ${dayMeta.label} game for ₹${gamePrice} to view Open, Jodi & Panel details.</p>`;
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        savedMobile = localStorage.getItem('app_user_mobile');
        if (!savedMobile) {
            window.location.href = 'index.html';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        marketName = (params.get('market') || '').trim().toUpperCase();
        if (!marketName) {
            window.location.href = 'dashboard.html';
            return;
        }

        document.getElementById('market-title').innerText = marketName;

        fetch(window.location.href, { method: 'HEAD' }).then(res => {
            const dHeader = res.headers.get('Date');
            if (dHeader) serverTimeOffset = Date.parse(dHeader) - Date.now();
            renderWeekAndCard();
        }).catch(() => {});

        onSnapshot(doc(db, "users", savedMobile), (snap) => {
            if (!snap.exists()) {
                window.location.href = 'index.html';
                return;
            }
            const uData = snap.data();
            if (uData.status === "blocked") {
                alert("❌ Your account profile has been suspended.");
                window.location.href = 'index.html';
                return;
            }
            currentUserWallet = Number(uData.balance) || Number(uData.walletBalance) || 0;
            document.getElementById('wallet-balance-text').innerText = "₹" + currentUserWallet;
            unlockedGames = uData.unlockedGames || {};
            renderWeekAndCard();
        });

        onSnapshot(doc(db, "markets", marketName), (snap) => {
            marketDocData = snap.exists() ? snap.data() : {};
            document.getElementById('market-date-sub').innerText = marketDocData.gameDate || new Date().toLocaleDateString('en-GB');
            renderWeekAndCard();
        });

        try {
            await setDoc(doc(db, "users", savedMobile), { lastSeen: Date.now() }, { merge: true });
        } catch (e) {}
    });
</script>
</body>
</html>
