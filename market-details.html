<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Details - Mahalakshmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #cbd5e1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding-bottom: 90px; }
        .app-container::-webkit-scrollbar { display: none; }
        @media (max-width: 450px) { .app-container { height: 100vh; max-height: 100vh; } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- FULL LOADING OVERLAY UNTIL ALL DATA IS READY -->
    <div id="page-loading-overlay" class="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-6 text-center space-y-3">
        <div class="w-10 h-10 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-black text-amber-300 uppercase tracking-widest">Loading Market Data...</p>
        <p class="text-[11px] text-slate-300 font-semibold">Please wait while details sync.</p>
    </div>

    <!-- HEADER -->
    <div class="bg-blue-900 text-white px-4 py-3.5 flex items-center justify-between shadow-lg sticky top-0 z-40">
        <div class="flex items-center space-x-2.5 min-w-0">
            <button onclick="goBackDashboard()" class="bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded-xl text-xs font-black shrink-0">← Back</button>
            <h1 id="market-title" class="font-black tracking-wider text-base uppercase leading-none truncate">MARKET</h1>
        </div>
        <span id="sub-header-badge" class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full bg-blue-950/80 border border-blue-700/60 text-amber-300 shrink-0">
            Syncing...
        </span>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-market-content" class="flex-1 p-4 space-y-4 opacity-0 pointer-events-none transition-opacity duration-200">

        <!-- THIS WEEK (LINE BY LINE DAYS) -->
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-200 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-xs text-blue-950 uppercase tracking-widest">📅 THIS WEEK</h2>
                <span class="text-[10px] font-bold text-gray-400 uppercase">Select Day</span>
            </div>

            <div id="week-days-bar" class="flex flex-col space-y-2">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- SELECTED DAY GAME CARD -->
        <div id="day-game-card" class="bg-white rounded-3xl p-4 shadow-sm border border-gray-200 flex flex-col space-y-3">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3 gap-2">
                <div class="flex items-center space-x-2.5 min-w-0">
                    <div class="w-10 h-10 bg-blue-50 rounded-2xl flex items-center justify-center shadow-sm border border-blue-100 overflow-hidden shrink-0">
                        <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-8 h-8 object-contain">
                    </div>
                    <div class="min-w-0">
                        <h3 id="card-market-heading" class="font-black text-sm tracking-wider text-gray-900 uppercase truncate">MARKET</h3>
                        <span id="card-day-label" class="text-[10px] text-blue-700 font-bold font-mono truncate block">--</span>
                    </div>
                </div>
                <div id="card-action-badge" class="shrink-0"></div>
            </div>

            <div id="card-inner-content" class="space-y-3 pt-1">
                <p class="text-xs text-gray-400 text-center py-4">Loading...</p>
            </div>
        </div>

    </div>

    <!-- FIXED BOTTOM BAR -->
    <div class="fixed bottom-0 left-0 right-0 z-50 flex justify-center pointer-events-none">
        <div class="w-full max-w-[450px] bg-slate-200/95 backdrop-blur-md border-t border-slate-300 p-3 shadow-2xl flex items-center gap-2 pointer-events-auto">
            <button onclick="goBackDashboard()" class="flex-1 bg-blue-900 hover:bg-blue-950 text-white font-black py-2.5 px-4 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Dashboard
            </button>
            <button onclick="window.location.reload();" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-black py-2.5 px-4 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Refresh
            </button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, collection, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA5JXFuo-bImK26QTZMYj8OrD2l1ncf_O4",
        authDomain: "mahalakshmi-1358f.firebaseapp.com",
        projectId: "mahalakshmi-1358f",
        storageBucket: "mahalakshmi-1358f.firebasestorage.app",
        messagingSenderId: "26487681138",
        appId: "1:26487681138:web:dfa4095fa2285b584212eb",
        measurementId: "G-Y2SVGE7BVJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const WEEKLY_DAYS = 7;
    const WEEKLY_MS = WEEKLY_DAYS * 24 * 60 * 60 * 1000;
    const PRICE_CACHE_KEY = "mahalakshmi_weekly_price_cache";

    const DAYS_ORDER = [
        { key: "monday", label: "Monday" },
        { key: "tuesday", label: "Tuesday" },
        { key: "wednesday", label: "Wednesday" },
        { key: "thursday", label: "Thursday" },
        { key: "friday", label: "Friday" },
        { key: "saturday", label: "Saturday" },
        { key: "sunday", label: "Sunday" }
    ];

    function readCachedPrice() {
        try {
            const num = Number(localStorage.getItem(PRICE_CACHE_KEY));
            if (!Number.isNaN(num) && num > 0) return num;
        } catch (e) {}
        return null;
    }

    function writeCachedPrice(price) {
        try {
            if (typeof price === "number" && !Number.isNaN(price) && price > 0) {
                localStorage.setItem(PRICE_CACHE_KEY, String(price));
            }
        } catch (e) {}
    }

    let savedMobile = "";
    let marketName = "";
    let isActiveSubscriber = false;
    let hasPendingSubscriptionRequest = false;
    let pendingUtrCode = "";
    let weeklyPlanPrice = readCachedPrice();
    let marketDocData = null;
    let serverTimeOffset = 0;
    let todayDayKey = "";
    let selectedDayKey = "";

    let readyFlags = {
        user: false,
        market: false,
        settings: false,
        pending: false
    };

    function isAllDataReady() {
        return readyFlags.user && readyFlags.market && readyFlags.settings && readyFlags.pending && weeklyPlanPrice !== null;
    }

    function syncReadyGate() {
        const overlay = document.getElementById('page-loading-overlay');
        const mainContent = document.getElementById('main-market-content');
        if (isAllDataReady()) {
            if (overlay) overlay.classList.add('hidden');
            if (mainContent) {
                mainContent.classList.remove('opacity-0', 'pointer-events-none');
                mainContent.classList.add('opacity-100');
            }
            renderWeekAndCard();
        } else {
            if (overlay) overlay.classList.remove('hidden');
            if (mainContent) {
                mainContent.classList.add('opacity-0', 'pointer-events-none');
                mainContent.classList.remove('opacity-100');
            }
        }
    }

    function getCorrectedNowMs() {
        return Date.now() + serverTimeOffset;
    }

    function parseExpiryTimestamp(val) {
        if (!val) return 0;
        if (typeof val === 'number') return val;
        if (typeof val === 'string') {
            const parsed = Number(val);
            if (!Number.isNaN(parsed) && parsed > 0) return parsed;
            const dateMs = Date.parse(val);
            return Number.isNaN(dateMs) ? 0 : dateMs;
        }
        if (typeof val === 'object') {
            if (typeof val.toMillis === 'function') return val.toMillis();
            if (typeof val.seconds === 'number') return val.seconds * 1000;
        }
        return 0;
    }

    function checkSubscriptionActive(uData = {}) {
        const nowMs = getCorrectedNowMs();
        const rawExpiry =
            uData.subscriptionExpiry ??
            uData.subscription_expiry ??
            uData.subscribedUntil ??
            uData.subscriptionEnd ??
            uData.weeklyExpiry ??
            0;

        const expiryMs = parseExpiryTimestamp(rawExpiry);
        if (expiryMs > 0) {
            return expiryMs > nowMs;
        }

        const explicitActiveFlag =
            uData.isSubscribed === true ||
            uData.subscriptionActive === true ||
            uData.is_subscribed === true ||
            uData.subscriptionStatus === "active";

        if (explicitActiveFlag) {
            const createdMs = parseExpiryTimestamp(uData.subscriptionStart ?? uData.subscribedAt ?? 0);
            if (createdMs > 0) {
                return (createdMs + WEEKLY_MS) > nowMs;
            }
            return true;
        }

        return false;
    }

    function getTodayDayKey(ms) {
        const dayIdx = new Date(ms).getDay();
        return dayIdx === 0 ? "sunday" : DAYS_ORDER[dayIdx - 1].key;
    }

    function getVisibleDays(weeklyMap, currentDayKey) {
        const currentIdx = DAYS_ORDER.findIndex(d => d.key === currentDayKey);
        return DAYS_ORDER.filter((d, idx) => {
            const hasEntry = weeklyMap && Object.prototype.hasOwnProperty.call(weeklyMap, d.key);
            if (currentIdx === -1) return true;
            return idx <= currentIdx || hasEntry;
        });
    }

    function getDayTimingText(dayKey, weeklyMap, fallbackData) {
        const entry = weeklyMap && weeklyMap[dayKey];
        if (entry && entry.timing && entry.timing.trim()) {
            return entry.timing.trim();
        }
        if (dayKey === todayDayKey && fallbackData && fallbackData.gameDate && fallbackData.gameDate.trim()) {
            return fallbackData.gameDate.trim();
        }
        return "--";
    }

    window.goBackDashboard = function() {
        window.location.href = "dashboard.html";
    }

    window.goToWeeklySubscription = function() {
        if (!isAllDataReady() || weeklyPlanPrice === null || hasPendingSubscriptionRequest) return;
        const mobileParam = encodeURIComponent(savedMobile || "");
        window.location.href = `payment.html?userid=${mobileParam}&plan=weekly_7d&days=${WEEKLY_DAYS}&amount=${Number(weeklyPlanPrice)}`;
    }

    window.selectWeekDay = function(dayKey) {
        if (!isAllDataReady()) return;
        selectedDayKey = dayKey;
        renderWeekAndCard();
    }

    function buildNumbersGridHtml(dayGameObj) {
        const otcRaw = (dayGameObj && dayGameObj.otcValue) || '';
        const jodiRaw = (dayGameObj && dayGameObj.jodiValue) || '';
        const panelRaw = (dayGameObj && dayGameObj.panelValue) || '';

        const otcList = otcRaw ? otcRaw.split(/[\s*\/]+/).filter(Boolean) : [];
        const jodiList = jodiRaw ? jodiRaw.split(/[\s,]+/).filter(Boolean) : [];
        const panelList = panelRaw ? panelRaw.split(/[\s,]+/).filter(Boolean) : [];

        if (!otcList.length && !jodiList.length && !panelList.length) {
            return `<p class="text-xs text-gray-400 font-semibold text-center py-4">No game numbers published for this day yet.</p>`;
        }

        let otcHtml = otcList.map(val => `<div class="bg-blue-50 text-blue-700 font-black text-xs py-2 px-3.5 rounded-xl text-center shadow-sm border border-blue-100 min-w-[36px]">${val}</div>`).join('');
        let jodiHtml = jodiList.map(val => `<div class="bg-indigo-50 text-indigo-700 font-black text-xs py-2 px-3 rounded-xl text-center shadow-sm border border-indigo-100 min-w-[38px]">${val}</div>`).join('');
        let panelHtml = panelList.map(val => `<div class="bg-emerald-50 text-emerald-700 font-black text-xs py-2 px-3 rounded-xl text-center shadow-sm border border-emerald-100 min-w-[44px]">${val}</div>`).join('');

        return `
            <div class="space-y-3 pt-1">
                ${otcList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-blue-900 uppercase tracking-wider w-16 shrink-0">Open</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${otcHtml}</div>
                </div>` : ''}

                ${jodiList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-indigo-900 uppercase tracking-wider w-16 shrink-0">Jodi</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${jodiHtml}</div>
                </div>` : ''}

                ${panelList.length ? `
                <div class="flex items-center justify-between bg-gray-50/80 p-2.5 rounded-2xl border border-gray-100">
                    <span class="text-xs font-black text-emerald-900 uppercase tracking-wider w-16 shrink-0">Panel</span>
                    <div class="flex items-center justify-center flex-wrap gap-1.5 flex-1">${panelHtml}</div>
                </div>` : ''}
            </div>`;
    }

    function renderWeekAndCard() {
        if (!isAllDataReady()) return;

        const nowMs = getCorrectedNowMs();
        todayDayKey = getTodayDayKey(nowMs);
        if (!selectedDayKey) selectedDayKey = todayDayKey;

        const weeklyMap = (marketDocData && marketDocData.weeklyGames) || {};
        const visibleDays = getVisibleDays(weeklyMap, todayDayKey);

        if (!visibleDays.some(d => d.key === selectedDayKey)) {
            selectedDayKey = visibleDays.length ? visibleDays[visibleDays.length - 1].key : todayDayKey;
        }

        const headerBadge = document.getElementById('sub-header-badge');
        if (headerBadge) {
            if (isActiveSubscriber) {
                headerBadge.innerText = "Subscribed";
                headerBadge.className = "text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-300/60 text-emerald-200 shrink-0";
            } else if (hasPendingSubscriptionRequest) {
                headerBadge.innerText = "Pending";
                headerBadge.className = "text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full bg-amber-400/20 border border-amber-300/60 text-amber-300 shrink-0";
            } else {
                headerBadge.innerText = "7-Day Plan";
                headerBadge.className = "text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full bg-blue-950/80 border border-blue-700/60 text-amber-300 shrink-0";
            }
        }

        const daysBar = document.getElementById('week-days-bar');
        daysBar.innerHTML = visibleDays.map(d => {
            const isSelected = d.key === selectedDayKey;
            const timingStr = getDayTimingText(d.key, weeklyMap, marketDocData);
            const activeClass = isSelected
                ? "bg-blue-900 text-white border-blue-900 shadow-md"
                : "bg-slate-50 text-slate-800 border-slate-200 hover:bg-blue-50";
            return `
                <button type="button" onclick="selectWeekDay('${d.key}')" class="w-full px-4 py-3 rounded-2xl border text-left transition-all flex items-center justify-between ${activeClass}">
                    <span class="text-sm font-black tracking-wide">${d.label}</span>
                    <span class="text-[11px] font-mono font-bold ${isSelected ? 'text-amber-300' : 'text-slate-500'}">${timingStr}</span>
                </button>`;
        }).join('');

        const dayMeta = DAYS_ORDER.find(d => d.key === selectedDayKey) || DAYS_ORDER[0];
        const selectedDayEntry = weeklyMap[selectedDayKey] || null;
        const selectedDayTiming = getDayTimingText(selectedDayKey, weeklyMap, marketDocData);

        document.getElementById('card-market-heading').innerText = marketName;
        document.getElementById('card-day-label').innerText = `${dayMeta.label} • ${selectedDayTiming}`;

        const badgeEl = document.getElementById('card-action-badge');
        const contentEl = document.getElementById('card-inner-content');

        const dayStatus = (selectedDayEntry && selectedDayEntry.status) || 'active';
        const canAccessGame = isActiveSubscriber || dayStatus === 'force_show';

        if (dayStatus === 'locked') {
            badgeEl.innerHTML = `<div class="bg-gray-100 text-gray-500 font-bold text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider border border-gray-200">🔒 CLOSED</div>`;
            contentEl.innerHTML = `<div class="w-full bg-gray-50 text-gray-400 font-bold text-xs py-3 px-4 rounded-2xl uppercase tracking-wider border border-gray-100 text-center">Market is currently closed</div>`;
        } else if (canAccessGame) {
            badgeEl.innerHTML = `<div class="bg-emerald-500 text-white font-bold text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider">✓ SUBSCRIBED</div>`;
            contentEl.innerHTML = buildNumbersGridHtml(selectedDayEntry);
        } else if (hasPendingSubscriptionRequest) {
            badgeEl.innerHTML = `<div class="bg-amber-400 text-blue-950 font-black text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider shadow-sm">⏳ Pending</div>`;
            contentEl.innerHTML = `
                <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-4 text-center space-y-2">
                    <p class="text-xs font-black text-blue-950">Subscription Request Pending</p>
                    <p class="text-[11px] text-slate-600 font-semibold leading-relaxed">
                        ${pendingUtrCode ? `UTR (${pendingUtrCode}) submitted. ` : ''}Waiting for admin approval or rejection.
                    </p>
                    <div class="inline-block bg-blue-950 text-amber-300 font-black text-xs px-4 py-2 rounded-xl uppercase tracking-wider">
                        Pending
                    </div>
                </div>`;
        } else {
            badgeEl.innerHTML = `<div class="bg-amber-100 text-amber-900 font-black text-[10px] py-1.5 px-3 rounded-xl uppercase tracking-wider border border-amber-300">🔒 SUBSCRIBERS ONLY</div>`;
            contentEl.innerHTML = `
                <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-4 text-center space-y-2.5">
                    <p class="text-xs font-black text-blue-950">7-Day Weekly Subscription Required</p>
                    <p class="text-[11px] text-slate-600 font-semibold leading-relaxed">
                        Game details are available only for active subscribers. Subscribe for 7 days (₹${weeklyPlanPrice}) to view game numbers directly.
                    </p>
                    <button type="button" onclick="goToWeeklySubscription()" class="bg-blue-900 hover:bg-blue-950 text-amber-300 font-black text-xs px-4 py-2.5 rounded-xl uppercase tracking-wider shadow transition-transform active:scale-95">
                        Subscribe (7 Days • ₹${weeklyPlanPrice})
                    </button>
                </div>`;
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        savedMobile = localStorage.getItem('app_user_mobile');
        if (!savedMobile) {
            window.location.href = 'index.html';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        marketName = (params.get('market') || '').trim().toUpperCase();
        if (!marketName) {
            window.location.href = 'dashboard.html';
            return;
        }

        document.getElementById('market-title').innerText = marketName;
        syncReadyGate();

        fetch(window.location.href, { method: 'HEAD' }).then(res => {
            const dHeader = res.headers.get('Date');
            if (dHeader) serverTimeOffset = Date.parse(dHeader) - Date.now();
            renderWeekAndCard();
        }).catch(() => {});

        onSnapshot(doc(db, "users", savedMobile), (snap) => {
            if (!snap.exists()) {
                window.location.href = 'index.html';
                return;
            }
            const uData = snap.data();
            if (uData.status === "blocked") {
                alert("❌ Your account profile has been suspended.");
                window.location.href = 'index.html';
                return;
            }
            isActiveSubscriber = checkSubscriptionActive(uData);
            readyFlags.user = true;
            syncReadyGate();
        });

        onSnapshot(collection(db, "pending_deposits"), (querySnapshot) => {
            let foundPending = false;
            let utrValue = "";
            const cleanSavedMobile = String(savedMobile || "").trim();

            querySnapshot.forEach((pDoc) => {
                const pData = pDoc.data() || {};
                const docUser = String(pData.userid || pData.userMobile || pData.phone || pData.mobile || "").trim();
                const statusVal = String(pData.status || "pending").toLowerCase();
                if (cleanSavedMobile && docUser === cleanSavedMobile && statusVal !== "approved" && statusVal !== "rejected") {
                    foundPending = true;
                    utrValue = pData.utr || pData.ref || "";
                }
            });

            hasPendingSubscriptionRequest = foundPending;
            pendingUtrCode = utrValue;
            readyFlags.pending = true;
            syncReadyGate();
        });

        onSnapshot(doc(db, "system_config", "settings"), (snap) => {
            if (snap.exists()) {
                const s = snap.data();
                const candidate =
                    s.weekly_subscription_price ??
                    s.weeklyPrice ??
                    s.subscription_price;
                const configuredPrice = Number(candidate);
                if (!Number.isNaN(configuredPrice) && configuredPrice > 0) {
                    weeklyPlanPrice = configuredPrice;
                    writeCachedPrice(configuredPrice);
                }
            }
            readyFlags.settings = true;
            syncReadyGate();
        });

        onSnapshot(doc(db, "markets", marketName), (snap) => {
            marketDocData = snap.exists() ? snap.data() : {};
            readyFlags.market = true;
            syncReadyGate();
        });

        try {
            await setDoc(doc(db, "users", savedMobile), { lastSeen: Date.now() }, { merge: true });
        } catch (e) {}
    });
</script>
</body>
</html>
