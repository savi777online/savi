<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalakshmi - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #cbd5e1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #e2e8f0; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding: 24px; }
        .app-container::-webkit-scrollbar { display: none; }
        @media (max-width: 450px) { .app-container { height: 100vh; max-height: 100vh; } }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- TOP LOGO & SPLASH HEADER -->
    <div class="flex flex-col items-center justify-center pt-6 pb-4 space-y-2">
        <img src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-28 h-28 object-contain drop-shadow-md">
        <h1 class="font-black tracking-widest text-xl uppercase text-blue-950">MAHALAKSHMI</h1>
    </div>

    <!-- MAIN LOGIN CARD -->
    <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-4 mt-2">
        
        <!-- STEP 1: MOBILE NUMBER INPUT -->
        <div id="step-mobile" class="space-y-3">
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Mobile Number</label>
                <div class="flex items-center bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden focus-within:border-blue-600">
                    <span class="bg-slate-100 px-3.5 py-3 text-xs font-bold text-slate-600 border-r border-slate-200">+91</span>
                    <input type="tel" id="input-mobile" maxlength="10" placeholder="Enter 10-digit number" class="w-full bg-transparent p-3 text-xs font-bold text-slate-800 focus:outline-none">
                </div>
            </div>
            <button onclick="handleMobileNext()" id="btn-next" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95 flex items-center justify-center">
                Next
            </button>
        </div>

        <!-- STEP 2: NEW USER REGISTRATION (NAME + PIN + CONFIRM PIN) -->
        <div id="step-name" class="space-y-3 hidden">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-2xl text-center">
                <p class="text-[11px] text-blue-900 font-bold">New Account Setup</p>
                <p class="text-[10px] text-blue-600 font-semibold" id="setup-mobile-display"></p>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Enter Your Full Name <span class="text-red-500">*</span></label>
                <input type="text" id="input-name" placeholder="Enter your full name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Enter 4-Digit PIN <span class="text-red-500">*</span></label>
                <input type="password" id="input-new-pin" maxlength="4" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600 tracking-widest">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Confirm 4-Digit PIN <span class="text-red-500">*</span></label>
                <input type="password" id="input-confirm-pin" maxlength="4" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600 tracking-widest">
            </div>
            <button onclick="completeNewUserRegistration()" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Create Account
            </button>
            <button onclick="resetToMobileStep()" class="w-full text-center text-[11px] text-slate-500 font-bold hover:underline pt-1">
                Change Mobile Number
            </button>
        </div>

        <!-- STEP 3: OLD USER PIN LOGIN -->
        <div id="step-pin" class="space-y-3 hidden">
            <div class="bg-blue-50 border border-blue-100 p-3 rounded-2xl text-center">
                <p class="text-[11px] text-blue-900 font-bold">Welcome Back, <span id="welcome-user-name">User</span>!</p>
                <p class="text-[10px] text-blue-600 font-semibold" id="login-mobile-display"></p>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Enter 4-Digit PIN <span class="text-red-500">*</span></label>
                <input type="password" id="input-login-pin" maxlength="4" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600 tracking-widest">
            </div>
            <button onclick="verifyLoginPin()" id="btn-login" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95 flex items-center justify-center">
                Login to Dashboard
            </button>
            <div class="flex justify-between items-center pt-1">
                <button onclick="resetToMobileStep()" class="text-[11px] text-slate-500 font-bold hover:underline">
                    Change Mobile Number
                </button>
                <button onclick="showForgotPinStep()" class="text-[11px] text-blue-600 font-bold hover:underline">
                    Forgot PIN?
                </button>
            </div>
        </div>

        <!-- STEP 4: FORGOT PIN -->
        <div id="step-forgot" class="space-y-3 hidden">
            <div class="bg-amber-50 border border-amber-100 p-3 rounded-2xl text-center">
                <p class="text-[11px] text-amber-900 font-bold">Forgot PIN Recovery</p>
                <p class="text-[10px] text-amber-600 font-semibold">Enter your registered details</p>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Mobile Number</label>
                <input type="tel" id="forgot-mobile" maxlength="10" placeholder="Enter 10-digit number" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="forgot-name" placeholder="Enter your full name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600">
            </div>
            <div id="forgot-result-box" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center">
                <p class="text-[11px] text-emerald-800 font-bold">Your 4-Digit PIN is:</p>
                <p class="text-sm text-emerald-900 font-black tracking-widest mt-1" id="recovered-pin-display"></p>
            </div>
            <button onclick="recoverPin()" id="btn-forgot" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-widest shadow transition-transform active:scale-95">
                Check Four Digit PIN
            </button>
            <button onclick="backToLoginFromForgot()" class="w-full text-center text-[11px] text-slate-500 font-bold hover:underline pt-1">
                Back to Login
            </button>
        </div>

    </div>

</div>

<!-- FIREBASE SDK & SCRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA5JXFuo-bImK26QTZMYj8OrD2l1ncf_O4",
        authDomain: "mahalakshmi-1358f.firebaseapp.com",
        projectId: "mahalakshmi-1358f",
        storageBucket: "mahalakshmi-1358f.firebasestorage.app",
        messagingSenderId: "26487681138",
        appId: "1:26487681138:web:dfa4095fa2285b584212eb",
        measurementId: "G-Y2SVGE7BVJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentMobile = "";
    let fetchedUserData = null;

    window.addEventListener('DOMContentLoaded', () => {
        // Auto-login: Agar user pehle se logged in hai toh direct dashboard par bhejo
        const savedMobile = localStorage.getItem('app_user_mobile');
        if (savedMobile) {
            window.location.href = 'dashboard.html';
        }
    });

    window.handleMobileNext = async function() {
        let rawInput = document.getElementById('input-mobile').value.trim();
        let cleaned = rawInput.replace(/\D/g, '');

        if (cleaned.length !== 10) {
            alert("❌ Please enter a valid 10-digit mobile number.");
            return;
        }

        currentMobile = cleaned;
        const btn = document.getElementById('btn-next');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';

        try {
            const userRef = doc(db, "users", currentMobile);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                // PURANA USER: PIN maango
                fetchedUserData = userSnap.data();
                if (fetchedUserData.status === "blocked") {
                    alert("❌ Your account has been suspended.");
                    btn.innerHTML = "Next";
                    btn.disabled = false;
                    return;
                }

                btn.innerHTML = "Next";
                btn.disabled = false;
                document.getElementById('step-mobile').classList.add('hidden');
                document.getElementById('step-pin').classList.remove('hidden');
                document.getElementById('login-mobile-display').innerText = "+91 " + currentMobile;
                document.getElementById('welcome-user-name').innerText = fetchedUserData.name || "User";
            } else {
                // NAYA USER: Naam aur PIN maango
                btn.innerHTML = "Next";
                btn.disabled = false;
                document.getElementById('step-mobile').classList.add('hidden');
                document.getElementById('step-name').classList.remove('hidden');
                document.getElementById('setup-mobile-display').innerText = "+91 " + currentMobile;
            }
        } catch (error) {
            alert("❌ Connection error: " + error.message);
            btn.innerHTML = "Next";
            btn.disabled = false;
        }
    }

    window.verifyLoginPin = function() {
        const pin = document.getElementById('input-login-pin').value.trim();
        if (pin.length !== 4) {
            alert("❌ Please enter a valid 4-digit PIN.");
            return;
        }

        if (fetchedUserData && fetchedUserData.pin && fetchedUserData.pin !== pin) {
            alert("❌ Incorrect 4-digit PIN! Please try again.");
            return;
        }

        // Agar user ke purane data mein PIN nahi tha (migration case), toh bypass ya save kar sakte hain
        localStorage.setItem('app_user_mobile', currentMobile);
        window.location.href = 'dashboard.html';
    }

    window.resetToMobileStep = function() {
        document.getElementById('step-name').classList.add('hidden');
        document.getElementById('step-pin').classList.add('hidden');
        document.getElementById('step-forgot').classList.add('hidden');
        document.getElementById('step-mobile').classList.remove('hidden');
        document.getElementById('input-mobile').value = "";
        document.getElementById('input-new-pin').value = "";
        document.getElementById('input-confirm-pin').value = "";
        document.getElementById('input-login-pin').value = "";
    }

    window.completeNewUserRegistration = async function() {
        const name = document.getElementById('input-name').value.trim();
        const pin = document.getElementById('input-new-pin').value.trim();
        const confirmPin = document.getElementById('input-confirm-pin').value.trim();

        if (!name) {
            alert("❌ Name is mandatory! Please enter your full name.");
            return;
        }
        if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
            alert("❌ Please enter a valid 4-digit PIN.");
            return;
        }
        if (pin !== confirmPin) {
            alert("❌ PIN and Confirm PIN do not match!");
            return;
        }

        const btn = document.getElementById('btn-register');
        btn.disabled = true;
        btn.innerText = "Creating Account...";

        try {
            const userRef = doc(db, "users", currentMobile);
            await setDoc(userRef, {
                name: name,
                pin: pin,
                walletBalance: 0,
                balance: 0,
                joinedAt: Date.now(),
                status: "allowed",
                unlockedGames: {}
            }, { merge: true });

            localStorage.setItem('app_user_mobile', currentMobile);
            window.location.href = 'dashboard.html';
        } catch (e) {
            alert("❌ Registration failed: " + e.message);
            btn.disabled = false;
            btn.innerText = "Create Account";
        }
    }

    window.showForgotPinStep = function() {
        document.getElementById('step-pin').classList.add('hidden');
        document.getElementById('step-forgot').classList.remove('hidden');
        document.getElementById('forgot-mobile').value = currentMobile;
        document.getElementById('forgot-result-box').classList.add('hidden');
    }

    window.backToLoginFromForgot = function() {
        document.getElementById('step-forgot').classList.add('hidden');
        document.getElementById('step-pin').classList.remove('hidden');
    }

    window.recoverPin = async function() {
        const mobileInput = document.getElementById('forgot-mobile').value.trim().replace(/\D/g, '');
        const nameInput = document.getElementById('forgot-name').value.trim().toLowerCase();

        if (mobileInput.length !== 10 || !nameInput) {
            alert("❌ Please enter both valid mobile number and full name.");
            return;
        }

        const btn = document.getElementById('btn-forgot');
        btn.disabled = true;
        btn.innerText = "Checking...";

        try {
            const userRef = doc(db, "users", mobileInput);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                alert("❌ No account found with this mobile number.");
                btn.disabled = false;
                btn.innerText = "Check Four Digit PIN";
                return;
            }

            const data = userSnap.data();
            if (data.name && data.name.trim().toLowerCase() === nameInput) {
                document.getElementById('recovered-pin-display').innerText = data.pin || "No PIN Set";
                document.getElementById('forgot-result-box').classList.remove('hidden');
            } else {
                alert("❌ Name does not match with this mobile number.");
            }
        } catch (e) {
            alert("❌ Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Check Four Digit PIN";
        }
    }
</script>
</body>
</html>
