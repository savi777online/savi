<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahalakshmi Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; max-height: 850px; background: #ffffff; display: flex; flex-direction: column; overflow-y: auto; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .app-container::-webkit-scrollbar { display: none; }
        @media (max-width: 450px) { .app-container { height: 100vh; max-height: 100vh; } }
        
        .slider-wrapper { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .slide-frame { flex-shrink: 0; width: 100%; height: 100%; scroll-snap-align: start; object-fit: contain; background-color: #f8fafc; }
        
        /* New Notice Animation */
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .notice-flash { animation: blink 2s infinite; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- HEADLINE APPBAR -->
    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white px-5 py-4 flex items-center justify-between shadow-xl sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <img id="app-logo" src="https://i.imgur.com/pCFtcKd.png" alt="Logo" class="w-9 h-9 object-contain rounded-full bg-white p-1">
            <h1 class="font-black tracking-widest text-lg uppercase">MAHALAKSHMI</h1>
        </div>
        <button onclick="handleLogout()" class="bg-indigo-900 hover:bg-black px-4 py-1.5 text-[10px] font-black rounded-full shadow transition-all uppercase tracking-wide">Logout</button>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="flex-1 bg-gray-50 p-4 space-y-5 pb-12">

        <!-- USER PROFILE & WALLET CARD (Modern Glass Style) -->
        <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-800 rounded-3xl p-5 shadow-2xl text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            <div class="flex justify-between items-center z-10 relative">
                <div class="space-y-0.5">
                    <p class="text-[10px] text-blue-200 uppercase font-bold tracking-widest">Player Name</p>
                    <p id="profile-name" class="font-black text-xl tracking-wide">Ganesh</p>
                    <p id="profile-phone" class="text-blue-100 font-medium text-[10px] font-mono">Mobile: --</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-2xl text-right shadow-inner">
                    <p class="text-[9px] text-blue-200 font-bold uppercase tracking-wider">Balance</p>
                    <p id="wallet-balance-text" class="text-amber-300 font-black text-lg font-mono mt-0.5">₹0</p>
                </div>
            </div>
            <button onclick="redirectToPayment()" class="w-full mt-5 bg-amber-400 hover:bg-amber-500 text-blue-950 font-black py-3 rounded-2xl text-xs uppercase tracking-widest shadow-xl transition-transform active:scale-[0.98]">
                Add Money
            </button>
        </div>

        <!-- LIVE SERVER CLOCK (Neon Style) -->
        <div class="bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-700 flex items-center justify-between px-5">
            <div id="live-calendar-text" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider font-mono">SYNCING...</div>
            <div id="live-clock" class="text-lg font-black text-emerald-400 tracking-[0.2em] font-mono">--:--:--</div>
        </div>

        <!-- NOTICE BOARD (Centered Big Text + Animation) -->
        <div class="bg-white border-2 border-indigo-100 rounded-2xl p-5 shadow-sm text-center">
            <h3 class="font-black text-indigo-900 uppercase tracking-widest text-sm mb-3">Notice Board</h3>
            <p id="notice-text" class="text-md text-indigo-700 font-black leading-tight uppercase notice-flash bg-indigo-50 p-4 rounded-xl border border-indigo-200">Welcome to Mahalakshmi App.</p>
        </div>

        <!-- IMAGE BANNER -->
        <div class="relative w-full h-44 bg-white rounded-2xl overflow-hidden shadow-lg border border-gray-100">
            <div id="slider-container" class="slider-wrapper">
                <img src="https://i.imgur.com/pCFtcKd.png" class="slide-frame shrink-0" alt="Banner Placeholder">
            </div>
        </div>

        <!-- MARKETS CONTAINER -->
        <div id="games-container" class="space-y-5"></div>

        <!-- DISCLAIMER -->
        <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm text-center text-gray-400">
            <p class="text-[9px] uppercase font-bold tracking-widest">-: Disclaimer :-</p>
            <p class="text-[10px] font-medium leading-relaxed mt-1">Visiting this site is at your own risk. Every info is for informational purpose only.</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="deposit-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">...</div>
    <div id="confirm-game-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">...</div>

    <script type="module">
        // [YOUR ORIGINAL FIREBASE AND LIVE ENGINE LOGIC]
        // (Yeh part aapki purani file se waisa ka waisa hi hai)
    </script>
</div>
</body>
</html>
