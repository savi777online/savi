<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Please Wait</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f6ff; color: #1e293b; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        
        .spinner-circle { width: 50px; height: 50px; border: 5px solid rgba(2, 89, 34, 0.2); border-top: 5px solid #025922; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .message { font-size: 15px; color: #0f172a; line-height: 1.5; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="spinner-circle"></div>
    <div class="message">Updating app. Please come back later.</div>
</div>

</body>
</html>
